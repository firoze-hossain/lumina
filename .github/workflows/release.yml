name: Release

# ==============================================================================
# Automated Multi-Platform Release Workflow for Lumina IDE
# 
# Triggered ONLY when a version tag like 'v0.1.0' or 'v1.0.0' is pushed.
# Standard code pushes to master/branches do NOT trigger this workflow.
#
# Builds native desktop installers across 3 parallel runner environments:
#   - Linux:   Ubuntu/Debian .deb package (with desktop menu, icons, MIME types)
#   - Windows: Inno Setup .exe installer wizard (with desktop/start menu shortcuts)
#              plus WiX .msi package
#   - macOS:   Apple .dmg disk image (with .app bundle and ICNS icon)
#
# Collects all artifacts, generates SHA-256 checksums, and publishes a GitHub Release.
# ==============================================================================

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Windows Tools (WiX & Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Derive version from Git tag
        shell: bash
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          else
            RAW_VER="1.0.0"
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"

          # Clean numeric version (strip tags/pre-release text like -beta, -alpha)
          BASE_VER="${RAW_VER%%-*}"
          CLEAN_VER=$(echo "$BASE_VER" | sed -E 's/[^0-9.]+//g' | awk -F. '{if (NF>3) print $1"."$2"."$3; else print $0}')
          if [[ -z "$CLEAN_VER" ]]; then
            CLEAN_VER="1.0.0"
          fi
          echo "clean_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

          # macOS jpackage bundler strictly requires the first number in app-version to be > 0
          # (1 to 3 integers separated by dots). If major is 0, map 0.X.Y -> 1.X.Y for Apple compatibility.
          FIRST_NUM=$(echo "$CLEAN_VER" | cut -d. -f1)
          if [[ "$FIRST_NUM" =~ ^[0-9]+$ ]] && [ "$FIRST_NUM" -eq 0 ]; then
            MAC_VER="1.${CLEAN_VER#0.}"
          else
            MAC_VER="$CLEAN_VER"
          fi
          if [[ -z "$MAC_VER" || "$MAC_VER" == "0"* ]]; then
            MAC_VER="1.0.0"
          fi
          echo "mac_version=${MAC_VER}" >> "$GITHUB_OUTPUT"
          echo "Derived versions: full=${RAW_VER}, clean=${CLEAN_VER}, mac=${MAC_VER}"

      - name: Set release version in Maven pom.xml
        shell: bash
        run: |
          mvn -B versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build Lumina JAR and Dependencies with Maven
        run: mvn -B clean package -DskipTests

      - name: Prepare common packaging input
        shell: bash
        run: |
          mkdir -p packaging/input dist
          cp target/lumina-ide-*.jar packaging/input/lumina.jar
          cp target/dependency/*.jar packaging/input/

      # ------------------------------------------------------------------------
      # Linux: In-place update package (.tar.gz) and .deb installer
      # ------------------------------------------------------------------------
      - name: Build Linux Update Package and .deb Installer
        if: matrix.platform == 'linux'
        run: |
          # 1. Build app-image for in-place update archive
          jpackage \
            --type app-image \
            --input packaging/input \
            --name lumina \
            --main-jar lumina.jar \
            --main-class dev.lumina.Launcher \
            --app-version "${{ steps.version.outputs.clean_version }}" \
            --vendor "Roze Ecosystem" \
            --icon packaging/linux/lumina.png \
            --dest dist/app-image

          tar -czf "dist/lumina-${{ steps.version.outputs.version }}-linux-update.tar.gz" -C dist/app-image lumina
          rm -rf dist/app-image

          # 2. Build .deb package installer
          sudo apt-get update
          sudo apt-get install -y fakeroot
          jpackage \
            --type deb \
            --input packaging/input \
            --name lumina \
            --main-jar lumina.jar \
            --main-class dev.lumina.Launcher \
            --app-version "${{ steps.version.outputs.clean_version }}" \
            --vendor "Roze Ecosystem" \
            --description "Lumina - Modern Java IDE & Multi-Database Administration Tool" \
            --linux-package-name lumina \
            --linux-deb-maintainer "maintainer@rozehub.dev" \
            --linux-shortcut \
            --linux-menu-group "Development;IDE;Java;" \
            --icon packaging/linux/lumina.png \
            --resource-dir packaging/linux \
            --dest dist

      # ------------------------------------------------------------------------
      # Windows: In-place update package (.zip) and Inno Setup .exe installer wizard
      # ------------------------------------------------------------------------
      - name: Build Windows Update Package and .exe Setup Wizard
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # 1. Create Windows runtime app image
          jpackage `
            --type app-image `
            --input packaging/input `
            --name Lumina `
            --main-jar lumina.jar `
            --main-class dev.lumina.Launcher `
            --app-version "${{ steps.version.outputs.clean_version }}" `
            --vendor "Roze Ecosystem" `
            --icon packaging\windows\Lumina.ico `
            --dest dist\lumina-win-pkg

          # 2. Package Windows in-place update zip (zero SmartScreen / UAC friction for existing users)
          Compress-Archive -Path "dist\lumina-win-pkg\Lumina\*" -DestinationPath "dist\Lumina-${{ steps.version.outputs.version }}-windows-update.zip" -Force

          # Move contents into a clean root structure for Inno Setup
          Move-Item -Path "dist\lumina-win-pkg\Lumina\*" -Destination "dist\lumina-win-pkg\"
          Remove-Item -Path "dist\lumina-win-pkg\Lumina" -Recurse -Force

          # 3. Compile Inno Setup .exe wizard (for fresh installs and full upgrades)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.version.outputs.version }}" packaging\windows\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (Test-Path "packaging\windows\dist\*.exe") {
            Move-Item -Path "packaging\windows\dist\*.exe" -Destination "dist\" -Force
          }

          # Clean intermediate app-image folder
          Remove-Item -Path "dist\lumina-win-pkg" -Recurse -Force

      # ------------------------------------------------------------------------
      # macOS: In-place update packages (.tar.gz & .zip), .pkg installer, and .dmg
      # ------------------------------------------------------------------------
      - name: Build macOS Update Packages, .pkg and .dmg Installers
        if: matrix.platform == 'macos'
        run: |
          # 1. Build app-image for in-place zero-quarantine updates
          jpackage \
            --type app-image \
            --input packaging/input \
            --name Lumina \
            --main-jar lumina.jar \
            --main-class dev.lumina.Launcher \
            --app-version "${{ steps.version.outputs.mac_version }}" \
            --vendor "Roze Ecosystem" \
            --icon packaging/macos/Lumina.icns \
            --dest dist/app-image

          # Compress update packages
          tar -czf "dist/Lumina-${{ steps.version.outputs.version }}-macos-update.tar.gz" -C dist/app-image Lumina.app
          (cd dist/app-image && zip -r -q "../../dist/Lumina-${{ steps.version.outputs.version }}-macos-update.zip" Lumina.app)
          rm -rf dist/app-image

          # 2. Build Apple .pkg installer package (direct installation to /Applications)
          jpackage \
            --type pkg \
            --input packaging/input \
            --name Lumina \
            --main-jar lumina.jar \
            --main-class dev.lumina.Launcher \
            --app-version "${{ steps.version.outputs.mac_version }}" \
            --vendor "Roze Ecosystem" \
            --mac-package-name Lumina \
            --icon packaging/macos/Lumina.icns \
            --dest dist

          # 3. Build macOS .dmg Disk Image
          jpackage \
            --type dmg \
            --input packaging/input \
            --name Lumina \
            --main-jar lumina.jar \
            --main-class dev.lumina.Launcher \
            --app-version "${{ steps.version.outputs.mac_version }}" \
            --vendor "Roze Ecosystem" \
            --description "Lumina - Modern Java IDE & Multi-Database Administration Tool" \
            --mac-package-name Lumina \
            --icon packaging/macos/Lumina.icns \
            --dest dist

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumina-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum *.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List Release Files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
